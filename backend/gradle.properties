# Build en esta máquina: el volumen de commit de Windows está limitado.
# Mantener los JVM del build pequeños evita el error "paging file is too small".
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
kotlin.compiler.execution.strategy=in-process
