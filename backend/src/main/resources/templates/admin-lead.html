<!doctype html>
<html lang="es"><head><meta name="color-scheme" content="light"></head><body style="margin:0;padding:0;background:#FFFFFF;" bgcolor="#FFFFFF">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#FFFFFF" style="background:#FFFFFF;padding:32px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;">
      <tr><td style="padding:0 0 16px;text-align:center;">
        <img src="{{ logoAcdan }}" alt="ACDAN Consultores" width="88" style="display:block;border:0;max-width:88px;height:auto;margin:0 auto;"/>
        <div style="font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:1.6px;color:#7B8AA0;text-transform:uppercase;margin-top:8px;">ACDAN Consultores · Sitio Web</div>
        <div style="height:2px;width:48px;background:#C9A86A;margin:8px auto 0;border-radius:2px;"></div>
      </td></tr>
      <tr><td bgcolor="#FFFFFF" style="background:#FFFFFF;border:1px solid #E5E9EF;border-radius:14px;padding:32px;">
        <h2 style="margin:0 0 16px;font-family:Helvetica,Arial,sans-serif;font-size:20px;color:#0F2A44;">Nuevo Lead de Contacto</h2>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-bottom:16px;">
          <tr><td style="font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#8B99AA;padding:5px 0;">Nombre</td><td style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:#0F2A44;padding:5px 0;">{{ nombre }}</td></tr>
          <tr><td style="font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#8B99AA;padding:5px 0;">Email</td><td style="font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#0F2A44;padding:5px 0;">{{ email }}</td></tr>
          <tr><td style="font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#8B99AA;padding:5px 0;">Teléfono</td><td style="font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#0F2A44;padding:5px 0;">{{ telefono }}</td></tr>
          <tr><td style="font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#8B99AA;padding:5px 0;">RFC</td><td style="font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#0F2A44;padding:5px 0;">{{ rfc }}</td></tr>
          <tr><td style="font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#8B99AA;padding:5px 0;">Interés</td><td style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:#C9A86A;padding:5px 0;">{{ interes }}</td></tr>
        </table>
        <div style="background:#F7F8FA;border:1px solid #E5E9EF;padding:14px;border-radius:8px;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#334155;line-height:1.5;">
          <strong>Mensaje:</strong><br/>
          {{ mensaje }}
        </div>
      </td></tr>
      <tr><td style="padding:20px 8px 0;text-align:center;">
        <img src="{{ logoPilli }}" alt="Pilli" width="44" style="display:block;border:0;max-width:44px;height:auto;margin:0 auto;"/>
        <div style="font-family:Helvetica,Arial,sans-serif;font-size:11px;color:#5A6B7E;margin-top:6px;"><strong style="color:#0F2A44;">Pilli Contable</strong> · Automatización fiscal de ACDAN Consultores</div>
        <div style="font-family:Helvetica,Arial,sans-serif;font-size:11px;color:#8B99AA;margin-top:4px;">Este correo se generó automáticamente. No respondas a este mensaje.</div>
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>
